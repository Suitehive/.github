name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: app
    attributes:
      label: Which part?
      options: [Mail, Calendar, Sign-in / Account, Admin console, Installer / CLI, New app, Other]
